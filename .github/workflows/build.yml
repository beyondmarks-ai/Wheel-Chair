name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python tools/prepare_android_model.py
      - run: ./android_phone/gradlew -p android_phone testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Blink-Assist-debug
          path: android_phone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: android_phone/app/build/reports/
  protocols:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Firmware host tests
        shell: bash
        run: |
          mkdir -p tmp/host-tests
          for source in tests/dfplayer/*test.cpp; do
            target="tmp/host-tests/$(basename "$source" .cpp)"
            g++ -std=c++17 -Wall -Wextra -Werror -I tests/dfplayer/stubs "$source" -o "$target"
            "$target"
          done
          g++ -std=c++17 -Wall -Wextra -Werror -I tests/ultrasonic/stubs tests/ultrasonic/test.cpp -o tmp/host-tests/ultrasonic
          tmp/host-tests/ultrasonic
